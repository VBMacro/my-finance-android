name: Build My Finance APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android Project
        run: |
          unzip -o MyFinance_Android_V1_0_3_GitHubActions.zip
          ls -la

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MyFinance.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyFinance-APK
          path: MyFinance.apk
